<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão · Pedroni</title>
<style>
:root{--bg:#12141a;--surf:#1a1d24;--surf2:#22262f;--surf3:#2a2f39;--line:#2e333d;--txt:#eceef1;--txt2:#9aa0aa;--txt3:#666d78;--mut:#9aa0aa;--rebar:#d97642;--rebar2:#e8915f;--rebar-dim:rgba(217,118,66,.12);--ok:#3fb873;--bad:#d9534f;--warn:#e0a52e;--blue:#5b9bd5}
*{-webkit-tap-highlight-color:transparent}
.app-header{position:sticky;top:0;z-index:40;background:rgba(18,20,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.ah-mark{width:34px;height:34px;background:var(--rebar);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;cursor:pointer}
.ah-title{flex:1;min-width:0}
.ah-title .t{font-size:1rem;font-weight:750;line-height:1.15;display:flex;align-items:center;gap:8px}
.ah-title .s{font-size:.72rem;color:var(--txt2);display:flex;align-items:center;gap:6px;margin-top:2px}
.ver{background:var(--rebar);color:#fff;font-size:.7rem;font-weight:800;border-radius:10px;padding:1px 8px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--txt3);flex-shrink:0}
.sync-dot.ok{background:var(--ok)}.sync-dot.off{background:var(--bad)}.sync-dot.demo{background:var(--warn)}
.ah-avatar{width:34px;height:34px;border-radius:50%;background:var(--surf3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:var(--rebar2);cursor:pointer;flex-shrink:0}
.welcome{margin:4px 0 20px}.welcome h2{font-size:1.55rem;font-weight:800;letter-spacing:-.01em}.welcome p{font-size:.9rem;color:var(--txt2);margin-top:4px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.dash-card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.dash-card:active{transform:scale(.98)}
.dc-ico{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:12px}
.dc-name{font-size:1rem;font-weight:750;line-height:1.2;display:flex;align-items:center}
.dc-desc{font-size:.76rem;color:var(--txt3);margin-top:5px;line-height:1.4}
.dc-num{font-size:.8rem;margin-top:8px;display:flex;justify-content:space-between;color:var(--txt2)}.dc-num b{color:var(--txt)}
.dc-status{position:absolute;top:14px;right:14px;font-size:.62rem;padding:3px 9px;border-radius:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dc-status.ok{background:rgba(63,184,115,.14);color:var(--ok)}.dc-status.wip{background:rgba(224,165,46,.14);color:var(--warn)}
.dc-fin .dc-ico{background:rgba(63,184,115,.12)}.dc-est .dc-ico{background:rgba(91,155,213,.12)}.dc-orc .dc-ico{background:var(--rebar-dim)}.dc-cfg .dc-ico{background:var(--surf3)}
.dc-wide{grid-column:1/-1;background:linear-gradient(135deg,var(--rebar-dim),var(--surf));border-color:rgba(217,118,66,.3)}
.dc-wide .dc-ico{background:var(--rebar)}
.dc-wide .tot{margin:10px 0 0}.dc-wide .tot div{background:rgba(0,0,0,.18)}
.dash-section{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--txt3);font-weight:700;margin:24px 0 10px}
.help{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--surf3);color:var(--txt2);font-size:.66rem;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle;flex-shrink:0;border:1px solid var(--line);font-style:normal;line-height:1}
.help:active{background:var(--rebar);color:#fff}
#help-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300}#help-bd.on{display:block}
#help-pop{display:none;position:fixed;left:14px;right:14px;bottom:18px;z-index:301;background:var(--surf2);border:1px solid var(--rebar);border-radius:12px;padding:15px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:620px;margin:0 auto}
#help-pop.on{display:block}
#help-pop h4{font-size:.95rem;color:var(--rebar2);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
#help-pop .x{background:var(--surf3);border:none;color:var(--txt2);width:28px;height:28px;border-radius:7px;font-size:1rem;cursor:pointer}
#help-c p{font-size:.86rem;line-height:1.55;margin-bottom:8px}#help-c p:last-child{margin-bottom:0}#help-c b{color:var(--rebar2)}
#help-c .ex{background:var(--surf3);border-radius:7px;padding:9px 11px;font-size:.8rem;color:var(--txt2);line-height:1.5;margin:8px 0}
#picker{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
#picker.on{display:flex}
.pk-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surf)}
.pk-h b{flex:1;font-size:1rem}
.pk-s{padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--line)}
#pk-lista{flex:1;overflow-y:auto;padding:0 14px 30px;-webkit-overflow-scrolling:touch}
.pk-g{font-size:.7rem;color:var(--rebar2);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:16px 0 4px;position:sticky;top:0;background:var(--bg);padding:4px 0}
.pk-i{display:flex;gap:10px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.92rem}
.pk-i:active{background:var(--surf2)}
.pk-i span{flex:1}.pk-i b{font-size:.82rem;color:var(--txt2);white-space:nowrap}.pk-i i{color:var(--warn);font-style:normal}
.pickf{width:100%;display:flex;align-items:center;gap:8px;text-align:left;background:var(--surf2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:14px;cursor:pointer;min-height:40px}
.pickf span{flex:1;line-height:1.3}.pickf b{color:var(--rebar2)}.pickf.vazio span{color:var(--txt3)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:84px;font-size:15px}
header{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
header.old h1{font-size:17px;font-weight:700;flex:1}
header h1 small{color:var(--mut);font-weight:500;font-size:12px;margin-left:6px}
.sync{font-size:12px;color:var(--mut)}
.sync.ok{color:var(--ok)}.sync.off{color:var(--bad)}.sync.demo{color:var(--warn)}
.ico{background:none;border:none;color:var(--txt);font-size:20px;cursor:pointer;padding:2px 6px}
main{padding:14px 14px 20px;max-width:900px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{flex:1;background:none;border:none;color:var(--mut);padding:9px 2px 10px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button b{font-size:20px;font-weight:400;line-height:1.1}
nav.bottom button.on{color:var(--rebar)}
.tabs{display:flex;gap:4px;margin:0 0 12px;overflow-x:auto}
.tabs button{background:var(--surf2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--rebar);border-color:var(--rebar);color:#fff;font-weight:600}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:600}
.mods{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.mods{grid-template-columns:1fr 1fr 1fr}}
.mod{cursor:pointer;border-left:4px solid var(--rebar)}
.mod h2{font-size:16px;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--mut)}
.kv b{color:var(--txt);font-weight:600}
.btn{background:var(--rebar);color:#fff;border:none;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--surf3);color:var(--txt);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.grow{flex:1}
input,select,textarea{background:var(--surf2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:15px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rebar)}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:flex;background:var(--surf2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:none;border:none;color:var(--mut);padding:9px 6px;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--rebar);color:#fff;font-weight:600}
.item{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .t{font-size:14px;font-weight:600}
.item .s{font-size:12px;color:var(--mut)}
.item .v{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:.02em}
.tag.nota{background:rgba(90,155,224,.18);color:var(--blue)}
.tag.semnota{background:rgba(217,164,58,.18);color:var(--warn)}
.tag.venc{background:rgba(229,83,75,.18);color:var(--bad)}
.tag.pago{background:rgba(63,178,127,.18);color:var(--ok)}
.tag.ab{background:var(--surf3);color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
.empty{color:var(--mut);text-align:center;padding:22px 10px;font-size:14px}
.wk{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wk b{flex:1;text-align:center;font-size:14px}
.tot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.tot div{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.tot small{display:block;color:var(--mut);font-size:11px}
.tot b{font-size:14px;white-space:nowrap}
.grp{font-size:11.5px;color:var(--rebar);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:14px 0 4px}
#modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px 10px 40px}
#modal.on{display:flex}
.mbox{background:var(--surf);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;padding:16px}
.mbox h2{font-size:17px;margin-bottom:4px;display:flex;align-items:center}
.mbox h2 .x{margin-left:auto}
.mfoot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.lin{display:grid;grid-template-columns:1fr 70px 32px;gap:6px;margin-bottom:6px;align-items:center}
.oel{background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.oel .nm{font-size:13.5px;font-weight:600;margin-bottom:6px;display:flex;gap:6px}
.oel .nm span{flex:1}
.oel .cp{font-size:11.5px;color:var(--mut);margin:-2px 0 6px}
.oel .g3 input{padding:7px 8px}
.oel .lt{text-align:right;font-weight:700;font-size:14px;align-self:end;padding-bottom:8px}
.totbox{background:var(--surf2);border-radius:10px;padding:10px 12px;margin-top:10px}
.totbox .kv{font-size:14px}
.totbox .kv.big{font-size:17px;color:var(--txt);border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
.prc{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.prc input{padding:6px 8px;text-align:right}
.warnbox{background:rgba(217,164,58,.12);border:1px solid rgba(217,164,58,.35);color:#e9c77b;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.infobox{background:rgba(90,155,224,.10);border:1px solid rgba(90,155,224,.3);color:#a9c9ef;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.logoprev{max-height:70px;max-width:200px;background:#fff;border-radius:6px;padding:4px;margin-top:6px}
/* logística */
.wk-strip{position:sticky;top:59px;z-index:30;background:var(--bg);padding:8px 0 10px;display:flex;gap:4px;align-items:center;margin:-6px 0 6px}
.wk-strip .btn{padding:8px 7px}
.dchip{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:5px 1px;text-align:center;cursor:pointer;min-width:0;transition:background .1s}
.dchip small{display:block;font-size:.6rem;color:var(--txt3);text-transform:uppercase;font-weight:700}
.dchip b{font-size:1rem;display:block;line-height:1.2}
.dchip i{display:block;font-style:normal;font-size:.56rem;color:var(--rebar2);min-height:11px;white-space:nowrap;overflow:hidden}
.dchip.on{border-color:var(--rebar);background:var(--rebar-dim)}
.dchip.hoje b{color:var(--rebar2)}
.log-tit{display:flex;align-items:center;gap:8px;margin:4px 0 10px}.log-tit b{font-size:1.1rem;display:block}.log-tit span{font-size:.8rem;color:var(--txt2)}
.lz{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px;transition:background .1s}
.lz-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lz-h .p{padding:3px 10px;border-radius:6px;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
.lz-h .p.manha{background:rgba(91,190,230,.2);color:#7fd0f0}
.lz-h .p.tarde{background:rgba(240,90,150,.2);color:#f58cb8}
.lz-h .p.sem{background:var(--surf3);color:var(--txt2)}
.lz-h .n{font-size:.78rem;color:var(--txt3)}
.lz-empty{border:1.5px dashed var(--line);border-radius:10px;padding:10px;text-align:center;color:var(--txt3);font-size:.76rem}
.lz-sem{opacity:.95;border-style:dashed}
@media(min-width:820px){.lz-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}}
.ec{background:var(--surf2);border:1px solid var(--line);border-left:4px solid #5bbee6;border-radius:10px;padding:9px 10px;margin-bottom:7px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ec.tarde{border-left-color:#f05a96}
.ec.st-entregue{opacity:.55}.ec.st-entregue .cl{text-decoration:line-through}
.ec.st-cancelada{opacity:.35}
.ec-top{display:flex;gap:8px;align-items:baseline}.ec-top .cl{flex:1;font-size:.92rem;line-height:1.25}.ec-top .cod{color:var(--txt3);font-weight:500;font-size:.8rem}
.ec-dest{font-size:.78rem;color:var(--rebar2);font-weight:700;text-align:right;max-width:45%}
.ec-it{font-size:.82rem;margin-top:3px;line-height:1.35}
.ec-ob{font-size:.75rem;color:var(--warn);margin-top:2px}
.ec-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.cg{border:1.5px solid var(--rebar);border-radius:12px;padding:6px;margin-bottom:8px;background:var(--rebar-dim)}
.cg-h{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--rebar2);padding:3px 4px 7px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cg-h span{margin-left:auto;font-weight:600;color:var(--txt2);font-size:.74rem}.cg-h i{color:var(--txt3);font-weight:500}
.cg .ec{margin-bottom:5px}
.drag-ghost{position:fixed;z-index:500;pointer-events:none;opacity:.93;transform:rotate(1.5deg) scale(1.03);box-shadow:0 14px 34px rgba(0,0,0,.65);margin:0}
.dragging{opacity:.25}
body.arrastando{user-select:none;-webkit-user-select:none;overflow-anchor:none}
.lz.drop-on,.dchip.drop-on{background:var(--rebar-dim);border-color:var(--rebar);box-shadow:0 0 0 2px var(--rebar)}
.ec.drop-on,.cg.drop-on{box-shadow:0 0 0 3px var(--ok);border-color:var(--ok)}
.ec.drop-on::after,.cg.drop-on::after{content:'juntar na mesma carga';display:block;font-size:.7rem;color:var(--ok);font-weight:700;margin-top:4px}
#toast{position:fixed;left:12px;right:12px;bottom:78px;z-index:400;background:var(--surf3);border:1px solid var(--rebar);border-radius:11px;padding:10px 12px;display:none;align-items:center;gap:10px;font-size:.86rem;max-width:600px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.on{display:flex}#toast span{flex:1}
</style>
</head>
<body>
<header class="app-header">
  <div class="ah-mark" onclick="irPara('home')">📊</div>
  <div class="ah-title"><div class="t">Gestão Pedroni <span class="ver" id="ver"></span></div><div class="s"><span class="sync-dot" id="sync-dot"></span><span id="sync">conectando…</span></div></div>
  <div class="ah-avatar" onclick="irPara('cfg')" title="Configurações">PE</div>
</header>
<main id="main"></main>
<nav class="bottom">
  <button data-nav="home" onclick="irPara('home')"><b>🏠</b>Início</button>
  <button data-nav="fin" onclick="irPara('fin')"><b>💰</b>Financeiro</button>
  <button data-nav="est" onclick="irPara('est')"><b>📦</b>Estoque</button>
  <button data-nav="orc" onclick="irPara('orc')"><b>📝</b>Orçamentos</button>
  <button data-nav="log" onclick="irPara('log')"><b>🚚</b>Entregas</button>
</nav>
<div id="modal"></div>
<div id="picker"><div class="pk-h"><b id="pk-t">Escolher produto</b><button class="btn sec sm" onclick="fecharPicker()">✕ Fechar</button></div><div class="pk-s"><input id="pk-busca" placeholder="filtrar (ex.: laje 1,70)…" oninput="pkRender()"></div><div id="pk-lista"></div></div>
<div id="toast"></div>
<div id="help-bd" onclick="fecharAjuda()"></div><div id="help-pop"><h4><span id="help-t"></span><button class="x" onclick="fecharAjuda()">×</button></h4><div id="help-c"></div></div>
<datalist id="dl-prod"></datalist>
<datalist id="dl-pess"></datalist>

<script>
// =====================================================================
// GESTÃO PEDRONI — financeiro, estoque e orçamentos
// Padrão FROTA: dados globais + onValue por coleção; render só desenha;
// só os botões/campos de edição salvam; saída sanitizada desde o início.
// Firebase: mesmo projeto do FROTA e do motor (gestao-de-frota-pedroni),
// dados no ramo /gestao. Lê do motor: custos/mp/produtos e custos/mo/prodReal.
// =====================================================================
const VERSAO = 'v12';
const firebaseConfig = {
  apiKey: "AIzaSyBqX8iLAtPTPHMIIHEBg3sGsDPVdHKq24U",
  authDomain: "gestao-de-frota-pedroni.firebaseapp.com",
  databaseURL: "https://gestao-de-frota-pedroni-default-rtdb.firebaseio.com",
  projectId: "gestao-de-frota-pedroni",
  storageBucket: "gestao-de-frota-pedroni.firebasestorage.app",
  messagingSenderId: "248388581510",

let db=null, fb=null, DEMO=true;
async function loadFirebase(){
  if(new URLSearchParams(location.search).has('demo')) return false;
  try{
    const [appMod, dbMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"),
    ]);
    const app = appMod.initializeApp(firebaseConfig);
    db = dbMod.getDatabase(app);
    fb = {ref:dbMod.ref, onValue:dbMod.onValue, set:dbMod.set, remove:dbMod.remove, get:dbMod.get, update:dbMod.update};
    return true;
  }catch(e){ console.warn('Firebase não carregou — modo demo:', e.message); return false; }
}

// ---------- utilidades ----------
const $ = id => document.getElementById(id);
function _encKey(k){ return String(k).replace(/[.#$/\[\]]/g, m=>({'.':'%2E','#':'%23','$':'%24','/':'%2F','[':'%5B',']':'%5D'}[m])); }
function _decKey(k){ return String(k).replace(/%2E|%23|%24|%2F|%5B|%5D/g, m=>({'%2E':'.','%23':'#','%24':'$','%2F':'/','%5B':'[','%5D':']'}[m])); }
function _sanitizeKeys(x){
  if(Array.isArray(x)) return x.map(_sanitizeKeys);
  if(x && typeof x==='object'){
    const o={};
    for(const k in x){
      const v=_sanitizeKeys(x[k]);
      if(v===undefined || typeof v==='function') continue;
      if(typeof v==='number' && !isFinite(v)) continue;
      o[_encKey(k)]=v;
    }
    return o;
  }
  if(typeof x==='number' && !isFinite(x)) return 0;
  if(x===undefined) return null;
  return x;
}
function _desanitizeKeys(x){
  if(Array.isArray(x)) return x.map(_desanitizeKeys);
  if(x && typeof x==='object'){ const o={}; for(const k in x) o[_decKey(k)]=_desanitizeKeys(x[k]); return o; }
  return x;
}
// Firebase devolve array como objeto {0:..} ou some com array vazio — normaliza
const arr = x => Array.isArray(x) ? x.filter(v=>v!=null) : (x && typeof x==='object' ? Object.keys(x).sort((a,b)=>(+a)-(+b)).map(k=>x[k]).filter(v=>v!=null) : []);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(s){
  if(typeof s==='number') return isFinite(s)?s:0;
  s=String(s||'').trim().replace(/[R$\s]/g,'');
  if(!s) return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const fmtR = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtN = n => (Number(n)||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const fmtV = n => (Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function hoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoDe(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDias(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoDe(d); }
function addMeses(iso,n){ const d=new Date(iso+'T12:00:00'); const dia=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(dia,ult)); return isoDe(d); }
function inicioSemana(iso){ const d=new Date(iso+'T12:00:00'); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return isoDe(d); }
function fmtD(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function fmtDc(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m; }
const numOrc = n => String(n||0).padStart(4,'0');

// ---------- dados ----------
const COLS=['config','clientes','composicoes','precos','orcamentos','estoqueInicio','movs','fin','entregas','cargas','revenda'];
const S={}; COLS.forEach(c=>S[c]={});
const EXT={produtos:null, prodReal:{}};

function setSync(st){
  const el=$('sync'); if(!el) return;
  $('sync-dot').className='sync-dot '+st;
  el.textContent = st==='ok'?'Sincronizado na nuvem':st==='off'?'Sem conexão':st==='demo'?'Modo demo (só este aparelho)':'conectando…';
}

function iniciarDados(){
  if(DEMO){
    COLS.forEach(c=>{ try{ S[c]=JSON.parse(localStorage.getItem('gestao_'+c)||'{}')||{}; }catch(e){ S[c]={}; } });
    try{ EXT.prodReal=JSON.parse(localStorage.getItem('custos_prodReal_demo')||'{}')||{}; }catch(e){}
    setSync('demo');
    setTimeout(migrarNomesGestao,0);
    return;
  }
  COLS.forEach(c=>{
    fb.onValue(fb.ref(db,'gestao/'+c), snap=>{ S[c]=_desanitizeKeys(snap.val()||{})||{}; _marcaCarregado(c); agendaRender(); },
      err=>{ console.error('onValue '+c, err); setSync('off'); });
  });
  fb.onValue(fb.ref(db,'custos/mp/produtos'), snap=>{
    const v=snap.val();
    if(v){ const L=arr(v).filter(p=>p&&p.nome); const nomes=L.map(p=>p.nome); if(nomes.length) EXT.produtos=nomes;
      EXT.idPorNome={}; L.forEach(p=>{ if(p.id!=null) EXT.idPorNome[p.nome]=String(p.id); }); }
    agendaRender();
  });
  // preço de venda digitado no Preço Final do motor (custos/preco/tabela, chave 'p'+id do produto)
  fb.onValue(fb.ref(db,'custos/preco/tabela'), snap=>{ EXT.tabelaMotor=_desanitizeKeys(snap.val()||{})||{}; agendaRender(); });
  fb.onValue(fb.ref(db,'custos/mo/prodReal'), snap=>{ EXT.prodReal=_desanitizeKeys(snap.val()||{})||{}; agendaRender(); });
  fb.onValue(fb.ref(db,'.info/connected'), s=>setSync(s.val()?'ok':'off'));
}

// salva UM item (ou o doc inteiro quando id==null). Nunca chamado de dentro de render.
function salvar(col, id, obj){
  if(id==null) S[col]=obj; else S[col][id]=obj;
  if(DEMO){ localStorage.setItem('gestao_'+col, JSON.stringify(S[col])); }
  else{
    const path='gestao/'+col+(id==null?'':'/'+_encKey(id));
    fb.set(fb.ref(db,path), _sanitizeKeys(obj)).catch(e=>{ console.error(e); alert('Erro ao salvar ('+col+'): '+e.message); });
  }
  agendaRender();
}
function excluir(col, id){
  delete S[col][id];
  if(DEMO) localStorage.setItem('gestao_'+col, JSON.stringify(S[col]));
  else fb.remove(fb.ref(db,'gestao/'+col+'/'+_encKey(id))).catch(e=>alert('Erro ao excluir: '+e.message));
  agendaRender();
}

// ---------- produtos / preços / composições ----------
function produtos(){
  const base=((EXT.produtos&&EXT.produtos.length)?EXT.produtos:PROD_DEFAULT).concat(revendaNomes());
  return Array.from(new Set(base)).sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function categoria(n){
  const s=String(n).toUpperCase();
  if(s.startsWith('ANEL')) return 'Anéis / Fossas';
  if(s.startsWith('LAJE')) return 'Lajes / Tampas';
  if(s.startsWith('CAIXA')) return 'Caixas';
  if(s.startsWith('TUBO')) return 'Tubos';
  if(/^(BLOCO|MEIO BLOCO|CANALETA|MEIO FIO)/.test(s)) return 'Blocos';
  if(/^(PAVER|PISO)/.test(s)) return 'Pisos e pavers';
  return 'Outros';
}
// preço do produto: 1º o preço de venda do motor (Preço Final); se não tiver, o da tabela da gestão
function precoMotor(n){ const id=(EXT.idPorNome||{})[n]; if(id==null) return 0; const v=parseFloat((EXT.tabelaMotor||{})['p'+id]); return v>0?v:0; }
const precoGestao = n => Number(S.precos[n])||0;
const precoProd = n => precoMotor(n) || precoGestao(n);
function precoComp(c){ return arr(c&&c.itens).reduce((s,i)=>s+(Number(i.qtd)||0)*precoProd(i.produto),0); }
function compSemPreco(c){ return arr(c&&c.itens).filter(i=>!precoProd(i.produto)).map(i=>i.produto); }
function existeProd(n){ return produtos().includes(n); }

// ---------- estoque ----------
function producoes(){
  const out=[], PR=EXT.prodReal||{};
  for(const setor in PR){
    const ps=PR[setor]||{};
    for(const prod in ps){
      arr(ps[prod]).forEach(l=>{
        if(!l) return;
        const dias=arr(l.dias);
        const data=l.data || (dias.length?dias.slice().sort().pop():'');
        const q=Number(l.qtd)||0;
        if(data && q) out.push({data, produto:prod, qtd:q, setor, sobra:!!l.sobra});
      });
    }
  }
  return out;
}
function movsAtivas(){ const dIni=(S.estoqueInicio&&S.estoqueInicio.data)||''; return Object.values(S.movs).filter(m=>m && (!dIni || m.data>=dIni)); }
function saldos(){
  const ini=S.estoqueInicio||{}, dIni=ini.data||'', sal={};
  const add=(p,q)=>{ sal[p]=(sal[p]||0)+q; };
  const si=ini.saldos||{}; for(const p in si) add(p, Number(si[p])||0);
  producoes().forEach(x=>{ if(!dIni||x.data>=dIni) add(x.produto,x.qtd); });
  movsAtivas().forEach(m=>{ const sg=m.tipo==='saida'?-1:1; arr(m.itens).forEach(i=>add(i.produto, sg*(Number(i.qtd)||0))); });
  return sal;
}

// ---------- financeiro ----------
function finLista(){ return Object.values(S.fin).filter(Boolean); }
function finVencido(l){ return !l.pago && l.venc && l.venc < hoje(); }
function finSemana(ini){
  const fim=addDias(ini,6), L=finLista();
  const prev=L.filter(l=>l.venc>=ini && l.venc<=fim);
  const venc=L.filter(l=>!l.pago && l.venc && l.venc<ini);
  const real=L.filter(l=>l.pago && l.dataPago>=ini && l.dataPago<=fim);
  const soma=(a,t)=>a.filter(l=>l.tipo===t).reduce((s,l)=>s+(Number(l.valor)||0),0);
  return {ini,fim,prev,venc,real,
    rec:soma(prev,'receber'), pag:soma(prev,'pagar'),
    recV:soma(venc,'receber'), pagV:soma(venc,'pagar'),
    recR:soma(real,'receber'), pagR:soma(real,'pagar')};
}

function hq(k){ return '<span class="help" onclick="event.stopPropagation();event.preventDefault();abrirAjuda(\''+k+'\')">?</span>'; }
function abrirAjuda(k){
  const a=AJUDAS[k]; if(!a) return;
  $('help-t').textContent=a.t; $('help-c').innerHTML=a.c;
  $('help-pop').classList.add('on'); $('help-bd').classList.add('on');
}
function fecharAjuda(){ $('help-pop').classList.remove('on'); $('help-bd').classList.remove('on'); }

// ---------- SELETOR DE PRODUTO (lista completa) ----------
let _pickCb=null, _pickPreco=false;
function abrirPicker(cb, mostrarPreco){
  _pickCb=cb; _pickPreco=!!mostrarPreco;
  $('pk-t').textContent='Escolher produto'; $('pk-busca').placeholder='filtrar (ex.: laje 1,70)…'; $('pk-busca').oninput=pkRender;
  $('pk-busca').value=''; pkRender(); $('picker').classList.add('on'); $('pk-lista').scrollTop=0;
}
function fecharPicker(){ $('picker').classList.remove('on'); _pickCb=null; }
let _pkLista=[];
function pkRender(){
  const b=$('pk-busca').value.toLowerCase().trim();
  const toks=b.split(/\s+/).filter(Boolean).map(t=>new RegExp('(^|[^0-9a-zà-öù-ú])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'));
  _pkLista=produtos().filter(p=>toks.every(r=>r.test(p)));
  let h='', g='';
  _pkLista.forEach((p,i)=>{ const c=categoria(p); if(c!==g){ g=c; h+='<div class="pk-g">'+c+'</div>'; }
    h+='<div class="pk-i" onclick="pkEscolher('+i+')"><span>'+esc(p)+(ehRevenda(p)?' <i style="color:var(--blue);font-size:.72rem">revenda</i>':'')+'</span>'+(_pickPreco?'<b>'+(precoProd(p)?fmtR(precoProd(p)):'<i>sem preço</i>')+'</b>':'')+'</div>'; });
  $('pk-lista').innerHTML=h||'<div class="empty">Nenhum produto encontrado</div>';
}
function pkEscolher(i){ const p=_pkLista[i], cb=_pickCb; fecharPicker(); if(cb && p) cb(p); }
function campoProd(valor, acao){
  return '<button type="button" class="pickf'+(valor?'':' vazio')+'" onclick="abrirPicker(function(v){'+acao+'})"><span>'+(valor?esc(valor):'Escolher produto…')+'</span><b>▾</b></button>';
}

// =====================================================================
// LOGÍSTICA DE ENTREGAS — folha do dia (manhã/tarde) com cartões arrastáveis
// Arrastar: toque longo (celular) ou clicar e arrastar (PC).
//  • solta numa faixa Manhã/Tarde → muda período (e sai da carga, se estava em uma)
//  • solta num dia da faixa da semana → muda o dia (mantém o período)
//  • solta em cima de outra entrega/carga → junta na mesma carga (mesmo caminhão)
//  • solta em "Sem data" → fica a reagendar
// =====================================================================
const PER={manha:'Manhã',tarde:'Tarde'};
const DIAS_SEM=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_EXT=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function diaSem(iso){ return DIAS_SEM[new Date(iso+'T12:00:00').getDay()]; }
function diaExt(iso){ return DIAS_EXT[new Date(iso+'T12:00:00').getDay()]; }
function entregasLista(){ return Object.values(S.entregas).filter(Boolean); }
function entregasDe(data,per){ return entregasLista().filter(e=>(e.data||'')===data && (per==null||e.periodo===per)); }
function ordemSort(a,b){ return (Number(a.ordem)||99)-(Number(b.ordem)||99) || (a.criado||0)-(b.criado||0); }
function membros(cid){ return entregasLista().filter(e=>e.cargaId===cid); }
function itensTxt(e){ const a=arr(e.itens).map(i=>fmtN(i.qtd)+'× '+i.produto); if(e.itensTxt) a.push(e.itensTxt); return a.join(' · '); }
function rotPer(data,per){ return data?(fmtDc(data)+' '+(PER[per]||'')).trim():'sem data'; }

// ---------- tela ----------
function vLog(){
  const d=UI.logDia||hoje(), ini=inicioSemana(d);
  let h='<div class="wk-strip"><button class="btn sm sec" onclick="setUI(\'logDia\',addDias(UI.logDia,-7))">◀</button>';
  for(let i=0;i<7;i++){
    const iso=addDias(ini,i), n=entregasDe(iso).filter(e=>e.status!=='cancelada').length;
    h+='<div class="dchip'+(iso===d?' on':'')+(iso===hoje()?' hoje':'')+'" data-drop="day" data-date="'+iso+'" onclick="setUI(\'logDia\',\''+iso+'\')"><small>'+diaSem(iso)+'</small><b>'+iso.slice(8)+'</b><i>'+(n?n+' ent.':'')+'</i></div>';
  }
  h+='<button class="btn sm sec" onclick="setUI(\'logDia\',addDias(UI.logDia,7))">▶</button></div>';
  const tot=entregasDe(d).filter(e=>e.status!=='cancelada');
  h+='<div class="log-tit"><div><b>'+diaExt(d)+', '+fmtD(d)+'</b><span>'+tot.length+' entrega(s)'+(d===hoje()?' · hoje':'')+'</span></div>'+hq('log_folha')+'</div>';
  h+='<div class="acts" style="align-items:center"><button class="btn" onclick="abrirEntrega()">+ Entrega</button><button class="btn sec sm" onclick="pdfFolhaDia(UI.logDia)">⎙ Folha do dia</button>'+(d!==hoje()?'<button class="btn sec sm" onclick="setUI(\'logDia\',hoje())">Hoje</button>':'')+hq('log_arrastar')+'</div>';
  h+='<div class="lz-cols">'+['manha','tarde'].map(per=>zonaHTML(d,per)).join('')+'</div>';
  const sem=entregasLista().filter(e=>!e.data && e.status!=='cancelada').sort(ordemSort);
  h+='<div class="lz lz-sem" data-drop="zone" data-date="" data-per=""><div class="lz-h"><span class="p sem">Sem data · a reagendar</span><span class="n">'+sem.length+'</span>'+hq('log_semdata')+'</div>'+
     blocosHTML(sem)+'<div class="lz-empty">arraste para cá o que ficou sem data</div></div>';
  return h;
}
function zonaHTML(d,per){
  const L=entregasDe(d,per).sort(ordemSort);
  return '<div class="lz" data-drop="zone" data-date="'+d+'" data-per="'+per+'"><div class="lz-h"><span class="p '+per+'">'+PER[per]+'</span><span class="n">'+L.filter(e=>e.status!=='cancelada').length+'</span></div>'+
    blocosHTML(L)+'<div class="lz-empty">arraste para cá</div></div>';
}
function blocosHTML(L){
  const feitos=new Set(); let h='';
  L.forEach(e=>{
    if(e.cargaId){
      if(feitos.has(e.cargaId)) return; feitos.add(e.cargaId);
      const ms=L.filter(x=>x.cargaId===e.cargaId);
      if(ms.length>1){ h+=cargaHTML(e.cargaId, ms); return; }
    }
    h+=cardHTML(e);
  });
  return h;
}
function cardHTML(e){
  const tags=[];
  if(e.vale) tags.push('<span class="tag pago">vale ok</span>');
  if(e.status==='entregue') tags.push('<span class="tag pago">✓ entregue</span>');
  if(e.status==='cancelada') tags.push('<span class="tag venc">cancelada</span>');

// ---------- arrastar (toque longo no celular / arrastar com mouse) ----------
const DR={on:false, timer:null, src:null, el:null, ghost:null, alvo:null, x:0, y:0, ox:0, oy:0, sx:0, sy:0, supress:false, scrollRaf:null};
function dragFonte(t){ if(nav!=='log' || !t || !t.closest) return null; const el=t.closest('[data-drag]'); return (el && $('main').contains(el))?el:null; }
function dragIni(el,x,y){
  DR.on=true; DR.el=el; DR.src={tipo:el.dataset.drag, id:el.dataset.id};
  const r=el.getBoundingClientRect(); DR.ox=x-r.left; DR.oy=y-r.top;
  const g=el.cloneNode(true); g.classList.add('drag-ghost'); g.style.width=r.width+'px'; g.removeAttribute('data-drop');
  document.body.appendChild(g); DR.ghost=g; el.classList.add('dragging');
  document.body.classList.add('arrastando');
  try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
  dragMove(x,y); dragAutoScroll();
}
function dragMove(x,y){
  DR.x=x; DR.y=y;
  DR.ghost.style.left=(x-DR.ox)+'px'; DR.ghost.style.top=(y-DR.oy)+'px';
  const under=document.elementFromPoint(x,y);
  let alvo=under&&under.closest?under.closest('[data-drop]'):null;
  // não pode soltar em si mesmo (nem a carga dentro dela mesma)
  if(alvo && (alvo===DR.el || DR.el.contains(alvo))) alvo=null;
  if(alvo && DR.src.tipo==='e' && alvo.dataset.drop==='carga' && (S.entregas[DR.src.id]||{}).cargaId===alvo.dataset.id) alvo=null;
  if(alvo!==DR.alvo){ if(DR.alvo) DR.alvo.classList.remove('drop-on'); DR.alvo=alvo; if(alvo) alvo.classList.add('drop-on'); }
}
function dragAutoScroll(){
  if(!DR.on) return;
  const m=90, H=window.innerHeight;
  if(DR.y<m+60) window.scrollBy(0,-Math.ceil((m+60-DR.y)/6));
  else if(DR.y>H-m) window.scrollBy(0,Math.ceil((DR.y-(H-m))/6));
  if(DR.ghost) dragMove(DR.x,DR.y);
  DR.scrollRaf=requestAnimationFrame(dragAutoScroll);
}
function dragFim(soltar){
  cancelAnimationFrame(DR.scrollRaf);
  const src=DR.src, alvo=DR.alvo;
  if(DR.ghost) DR.ghost.remove(); if(DR.el) DR.el.classList.remove('dragging'); if(alvo) alvo.classList.remove('drop-on');
  document.body.classList.remove('arrastando');
  DR.on=false; DR.ghost=null; DR.el=null; DR.alvo=null; DR.src=null;
  DR.supress=true; setTimeout(()=>DR.supress=false,350);
  if(soltar && src && alvo) aplicarDrop(src, alvo);
  if(_pend){ _pend=false; render(); }
}
function dragSetup(){
  // toque: segura ~0,35 s para pegar o cartão (deslizar antes disso = rolar a tela normalmente)
  document.addEventListener('touchstart',ev=>{
    const el=dragFonte(ev.target); if(!el || ev.touches.length>1) return;
    const t=ev.touches[0]; DR.sx=t.clientX; DR.sy=t.clientY;
    clearTimeout(DR.timer); DR.timer=setTimeout(()=>{ DR.timer=null; dragIni(el,DR.sx,DR.sy); },350);
  },{passive:true});
  document.addEventListener('touchmove',ev=>{
    const t=ev.touches[0];
    if(DR.on){ ev.preventDefault(); dragMove(t.clientX,t.clientY); return; }
    if(DR.timer && (Math.abs(t.clientX-DR.sx)>9 || Math.abs(t.clientY-DR.sy)>9)){ clearTimeout(DR.timer); DR.timer=null; }
    else if(DR.timer){ DR.sx=t.clientX; DR.sy=t.clientY; }
  },{passive:false});
  document.addEventListener('touchend',ev=>{ clearTimeout(DR.timer); DR.timer=null; if(DR.on){ ev.preventDefault(); dragFim(true); } },{passive:false});
  document.addEventListener('touchcancel',()=>{ clearTimeout(DR.timer); DR.timer=null; if(DR.on) dragFim(false); });
  // mouse: clicar e arrastar mais de 6 px
  document.addEventListener('mousedown',ev=>{
    if(ev.button!==0) return; const el=dragFonte(ev.target); if(!el) return;
    const sx=ev.clientX, sy=ev.clientY; let ativo=false;
    const mm=e=>{ if(!ativo && (Math.abs(e.clientX-sx)>6||Math.abs(e.clientY-sy)>6)){ ativo=true; dragIni(el,sx,sy); } if(ativo){ e.preventDefault(); dragMove(e.clientX,e.clientY); } };
    const mu=()=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); if(ativo) dragFim(true); };
    document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu);
  });
  document.addEventListener('click',ev=>{ if(DR.supress && $('main').contains(ev.target)){ ev.stopPropagation(); ev.preventDefault(); } },true);
  document.addEventListener('contextmenu',ev=>{ if(dragFonte(ev.target)) ev.preventDefault(); });
}

// ---------- regras do soltar ----------
function _snapLog(){ return JSON.parse(JSON.stringify({e:S.entregas||{}, c:S.cargas||{}})); }
function _hist(e, txt){ e.historico=arr(e.historico); e.historico.push({em:Date.now(), txt}); if(e.historico.length>30) e.historico=e.historico.slice(-30); }
function moverEntrega(e, data, per, sairCarga){
  const de=rotPer(e.data,e.periodo);
  e.data=data||''; if(per!==undefined) e.periodo=per||e.periodo||'manha';
  if(sairCarga) e.cargaId='';
  const para=rotPer(e.data,e.periodo);
  if(de!==para) _hist(e, de+' → '+para);
}
function aplicarDrop(src, alvo){
  const antes=_snapLog();
  const lista = src.tipo==='c' ? membros(src.id).map(x=>JSON.parse(JSON.stringify(x))) : [JSON.parse(JSON.stringify(S.entregas[src.id]))];
  if(!lista.length || !lista[0]) return;
  const tipo=alvo.dataset.drop; let msg='';
  if(tipo==='zone' || tipo==='day'){
    const data=alvo.dataset.date;
    const per = tipo==='zone' ? (alvo.dataset.per||lista[0].periodo||'manha') : (lista[0].periodo||'manha');
    if(!lista.some(e=>(e.data||'')!==data || e.periodo!==per || (src.tipo==='e' && e.cargaId))) return;
    // carga inteira mantém-se junta; entrega solta sai da carga
    lista.forEach(e=>{ moverEntrega(e, data, per, src.tipo==='e'); salvar('entregas', e.id, e); });
    msg=(lista.length>1?'Carga movida':'Entrega movida')+' para '+rotPer(data,per);
  }else{
    // juntar na carga do alvo
    const alvoE = tipo==='card' ? S.entregas[alvo.dataset.id] : membros(alvo.dataset.id)[0];
    if(!alvoE) return;
    let cid=alvoE.cargaId;
    if(!cid){
      cid=uid();
      const base={id:cid, motorista:alvoE.motorista||lista[0].motorista||'', caminhao:alvoE.caminhao||lista[0].caminhao||'', criado:Date.now()};
      salvar('cargas', cid, base);
      const b=JSON.parse(JSON.stringify(alvoE)); b.cargaId=cid; salvar('entregas', b.id, b);
    }else if(src.tipo==='c' && S.cargas[src.id]){
      const c=Object.assign({}, S.cargas[cid]), o=S.cargas[src.id];
      if(!c.motorista && o.motorista) c.motorista=o.motorista; if(!c.caminhao && o.caminhao) c.caminhao=o.caminhao;
      salvar('cargas', cid, c);
    }
    lista.forEach(e=>{ moverEntrega(e, alvoE.data, alvoE.periodo, false); e.cargaId=cid; _hist(e,'juntada na carga com '+(alvoE.cliente||'outra entrega')); salvar('entregas', e.id, e); });
    msg='Juntou na mesma carga ('+(membros(cid).length)+' entregas)';
  }
  limparCargas();
  toastUndo(msg, antes);
}
// carga com 1 entrega só deixa de existir
function limparCargas(){
  const cont={}; entregasLista().forEach(e=>{ if(e.cargaId) cont[e.cargaId]=(cont[e.cargaId]||0)+1; });
  entregasLista().forEach(e=>{ if(e.cargaId && (cont[e.cargaId]||0)<2){ const c=S.cargas[e.cargaId]||{}; const x=JSON.parse(JSON.stringify(e)); x.cargaId=''; if(!x.motorista&&c.motorista) x.motorista=c.motorista; if(!x.caminhao&&c.caminhao) x.caminhao=c.caminhao; salvar('entregas', x.id, x); } });
  Object.keys(S.cargas).forEach(cid=>{ if((cont[cid]||0)<2) excluir('cargas', cid); });
}
let _undo=null, _toastT=null;
function toastUndo(msg, antes){
  _undo=antes;
  $('toast').innerHTML='<span>'+esc(msg)+'</span><button class="btn sm sec" onclick="desfazerLog()">Desfazer</button>';
  $('toast').classList.add('on'); clearTimeout(_toastT); _toastT=setTimeout(()=>{ $('toast').classList.remove('on'); _undo=null; },7000);
}
function desfazerLog(){
  const a=_undo; if(!a) return; _undo=null; $('toast').classList.remove('on');
  ['e','c'].forEach(k=>{
    const col=k==='e'?'entregas':'cargas', atual=S[col]||{}, velho=a[k]||{};
    const ids=new Set(Object.keys(atual).concat(Object.keys(velho)));
    ids.forEach(id=>{ const v=velho[id], n=atual[id];
      if(JSON.stringify(v)===JSON.stringify(n)) return;
      if(v) salvar(col, id, v); else excluir(col, id); });
  });
}

function salvarEntrega(){
  const e=EE;

async function impLer(inp){

function carregarXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,err)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=()=>ok(window.XLSX); s.onerror=()=>err(new Error('sem internet para abrir Excel')); document.head.appendChild(s); });

// sistemas de nota no Brasil costumam gravar em Windows-1252 (acentos); tenta UTF-8 primeiro
function decodificar(buf){
  let t=new TextDecoder('utf-8').decode(buf);
  if(t.includes('�')){ try{ t=new TextDecoder('windows-1252').decode(buf); }catch(e){} }
  return t.replace(/^﻿/,'');
}
function parseCSV(txt){
  const amostra=txt.split(/\r?\n/).slice(0,10).join('\n');
  const seps=[';','\t',',','|']; let sep=';', melhor=-1;
  seps.forEach(s=>{ const n=amostra.split('\n').map(l=>l.split(s).length-1); const m=Math.min(...n.filter((x,i)=>i<5)); const tot=n.reduce((a,b)=>a+b,0); if(tot>0 && (m*10+tot)>melhor){ melhor=m*10+tot; sep=s; } });
  const out=[]; let row=[], cel='', q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else q=false; } else cel+=ch; continue; }
    if(ch==='"' && cel===''){ q=true; continue; }
    if(ch===sep){ row.push(cel); cel=''; continue; }
    if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cel); out.push(row); row=[]; cel=''; continue; }
    cel+=ch;
  }
  if(cel!==''||row.length){ row.push(cel); out.push(row); }
  return out;
}
function acharCabecalho(L){
  const chaves=new Set(IMP_CAMPOS.flatMap(c=>c[2]));
  let best=0, bestN=-1;
  for(let i=0;i<Math.min(15,L.length);i++){
    const n=L[i].filter(c=>chaves.has(_normH(c))||IMP_CAMPOS.some(f=>f[2].some(k=>k.length>3&&_normH(c).includes(k)))).length;
    if(n>bestN){ bestN=n; best=i; }
  }
  return bestN>=2?best:0;
}
function autoMapa(cab){
  const H=cab.map(_normH), usado=new Set(), m={};
  // 1ª passada: nome exato; 2ª: contém
  [true,false].forEach(exato=>{
    IMP_CAMPOS.forEach(([k,,pats])=>{
      if(m[k]!=null) return;
      for(const p of pats){
        const i=H.findIndex((h,ix)=>!usado.has(ix) && (exato? h===p : (p.length>2 && h.includes(p))));
        if(i>=0){ m[k]=i; usado.add(i); break; }
      }
    });
  });
  return m;
}
function assinatura(cab){ return _encKey(cab.map(_normH).join('|')).slice(0,180); }

    municipio:g('cidade'), uf:g('uf').toUpperCase(), fone:g('fone'), cel:(g('cel')&&g('cel')!==g('fone'))?g('cel'):'', email:g('email').toLowerCase()};

function impAcharExistente(c, porCod, porDoc, porNome){
  return (c.codigo&&porCod[c.codigo]) || (_dig(c.doc).length>=11&&porDoc[_dig(c.doc)]) || porNome[c.nome.toLowerCase()];
}
function impIndices(){
  const porCod={}, porDoc={}, porNome={};
  Object.values(S.clientes).filter(Boolean).forEach(x=>{ if(x.codigo) porCod[x.codigo]=x; const d=_dig(x.doc); if(d.length>=11) porDoc[d]=x; if(x.nome) porNome[x.nome.toLowerCase()]=x; });
  return {porCod,porDoc,porNome};
}
function impCalcular(){
  const dados=IMP.linhas.slice(IMP.ini+1);
  const {porCod,porDoc,porNome}=impIndices();
  const vistos=new Set(); let novos=0, atual=0, iguais=0, sem=0, dup=0; const lista=[];
  dados.forEach(r=>{
    const c=impCliente(r); if(!c){ sem++; return; }
    const chave=c.codigo?'c'+c.codigo:(_dig(c.doc).length>=11?'d'+_dig(c.doc):'n'+c.nome.toLowerCase());
    if(vistos.has(chave)){ dup++; return; } vistos.add(chave);
    const ex=impAcharExistente(c,porCod,porDoc,porNome);
    if(!ex){ novos++; lista.push({c,ex:null}); return; }
    // atualiza só com o que veio preenchido; não apaga o que já existe (ex.: local da obra)
    const m=Object.assign({},ex); Object.keys(c).forEach(k=>{ if(c[k]) m[k]=c[k]; });
    if(JSON.stringify(m)===JSON.stringify(ex)){ iguais++; return; }
    atual++; lista.push({c:m,ex});
  });
  return {lista,novos,atual,iguais,sem,dup,total:dados.length};
}

// ---------- importar planilha de composições ----------
// Formato: uma aba por grupo (FOSSAS, FILTROS…), blocos com PRODUTO | COD. SISTEMA | COMPOSIÇÃO | QUANTIDADE | VALOR | TOTAL
function normPeca(n){
  n=String(n||'').trim().replace(/PRÉ MOLDADA/gi,'PRÉ FABRICADA').replace(/\s+/g,' ');
  n=n.replace(/(Ø\d,\d\d)\s*x\s*(\d)/g,'$1 x$2');
  return n; // a planilha já vem com os nomes novos — não aplicar a troca de novo
}
let ICP=null;
function abrirImportComp(){
  ICP={comps:null, nomeArq:'', remover:true};
  abrirModal('<h2>Importar planilha de composições'+hq('comp_imp')+'<button class="ico x" onclick="fecharModal()">✕</button></h2>'+
    '<div class="infobox">Escolha a planilha (.xlsx) com as abas de fossas, filtros, sumidouros, cisternas e caixas. Ela traz as peças de cada composição <b>e o preço de cada peça</b>.</div>'+
    '<input type="file" accept=".xlsx,.xls,.ods" onchange="icpLer(this)"><div id="icp-corpo" style="margin-top:12px"></div>');
}
async function icpLer(inp){
  const f=inp.files&&inp.files[0]; if(!f) return; ICP.nomeArq=f.name;
  $('icp-corpo').innerHTML='<div class="mut">Lendo '+esc(f.name)+'…</div>';
  try{
    const XLSX=await carregarXLSX();
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const comps=[];
    wb.SheetNames.forEach(sh=>{
      const L=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1,raw:true,defval:''});
      const grupo=sh.trim().charAt(0).toUpperCase()+sh.trim().slice(1).toLowerCase();
      let cur=null;
      L.forEach(r=>{
        const a=String(r[0]==null?'':r[0]).trim(), c=String(r[2]==null?'':r[2]).trim();
        if(/^produto$/i.test(a) || /^composi/i.test(a) || /^composi[cç][aã]o$/i.test(c)) { if(/^produto$/i.test(a)) cur=null; return; }
        if(a && c){ cur={nome:a.replace(/\s+/g,' '), grupo, itens:[]}; comps.push(cur); }
        if(c && cur){ const q=parseNum(r[3]), v=parseNum(r[4]); if(q>0) cur.itens.push({produto:normPeca(c), qtd:q, val:v, cod:String(r[1]==null?'':r[1]).trim()}); }
      });
    });
    if(!comps.length) throw new Error('não encontrei composições no formato esperado');
    // nomes repetidos → acrescenta o diâmetro do 1º anel/caixa
    const cont={}; comps.forEach(c=>cont[c.nome.toLowerCase()]=(cont[c.nome.toLowerCase()]||0)+1);
    comps.forEach(c=>{ if(cont[c.nome.toLowerCase()]>1){ const m=(c.itens[0]&&c.itens[0].produto.match(/Ø\d,\d\d/)); c.nome+=' ('+(m?m[0]:c.grupo)+')'; } });
    ICP.comps=comps; icpRender();
  }catch(e){ console.error(e); $('icp-corpo').innerHTML='<div class="warnbox">Não consegui ler: '+esc(e.message)+'</div>'; }
}
function icpCalc(){
  const comps=ICP.comps;
  // preço de cada peça: o valor que mais aparece na planilha
  const vals={}; comps.forEach(c=>c.itens.forEach(i=>{ if(i.val>0){ const o=vals[i.produto]=vals[i.produto]||{}; o[i.val]=(o[i.val]||0)+1; } }));
  const preco={}, conflito=[];
  Object.keys(vals).forEach(p=>{ const ks=Object.keys(vals[p]); ks.sort((a,b)=>vals[p][b]-vals[p][a]); preco[p]=+ks[0]; if(ks.length>1) conflito.push(p+': '+ks.map(k=>fmtR(+k)).join(' / ')); });
  const conhecidos=new Set(produtos());
  const novosRev=Object.keys(preco).filter(p=>!conhecidos.has(p)).concat([].concat(...comps.map(c=>c.itens.map(i=>i.produto))).filter(p=>!conhecidos.has(p)&&!(p in preco)));
  const revNovos=Array.from(new Set(novosRev)).sort();
  const precoMuda=Object.keys(preco).filter(p=>Math.abs(precoProd(p)-preco[p])>0.004);
  const porNome={}; Object.values(S.composicoes).filter(Boolean).forEach(c=>porNome[(c.nome||'').toLowerCase()]=c);
  const nomesPlan=new Set(comps.map(c=>c.nome.toLowerCase()));
  const novas=comps.filter(c=>!porNome[c.nome.toLowerCase()]).length;
  const sobram=Object.values(S.composicoes).filter(c=>c&&!nomesPlan.has((c.nome||'').toLowerCase()));
  return {preco,conflito,revNovos,precoMuda,porNome,novas,atual:comps.length-novas,sobram};
}
function icpRender(){
  const r=icpCalc(), comps=ICP.comps;
  const grupos={}; comps.forEach(c=>grupos[c.grupo]=(grupos[c.grupo]||0)+1);
  let h='<div class="mut">'+esc(ICP.nomeArq)+' · '+comps.length+' composições ('+Object.keys(grupos).map(g=>g+' '+grupos[g]).join(' · ')+')</div>';
  h+='<div class="tot" style="margin-top:10px"><div><small>Novas</small><b class="pos">'+r.novas+'</b></div><div><small>Atualizadas</small><b>'+r.atual+'</b></div><div><small>Preços de peça</small><b>'+r.precoMuda.length+'</b></div></div>';
  if(r.revNovos.length) h+='<div class="infobox"><b>'+r.revNovos.length+' peça(s) não estão no motor</b> e serão cadastradas como <b>produtos de revenda</b>:<br>'+r.revNovos.map(esc).join('<br>')+'</div>';
  if(r.conflito.length) h+='<div class="warnbox"><b>Peças com preços diferentes na planilha</b> (usei o que mais aparece):<br>'+r.conflito.map(esc).join('<br>')+'</div>';
  if(r.sobram.length) h+='<label class="f"><input type="checkbox" style="width:auto" '+(ICP.remover?'checked':'')+' onchange="ICP.remover=this.checked"> Apagar '+r.sobram.length+' composição(ões) que não estão na planilha: '+esc(r.sobram.map(c=>c.nome).join('; '))+'</label>';
  h+='<div class="grp">Prévia</div>'+comps.slice(0,5).map(c=>'<div class="item" style="cursor:default"><div class="grow"><div class="t">'+esc(c.nome)+' <span class="tag ab">'+esc(c.grupo)+'</span></div><div class="s">'+c.itens.map(i=>fmtN(i.qtd)+'× '+esc(i.produto)).join(' + ')+'</div></div><div class="v">'+fmtR(c.itens.reduce((s,i)=>s+i.qtd*(r.preco[i.produto]||0),0))+'</div></div>').join('');
  h+='<div class="mfoot"><button class="btn" onclick="icpGravar()">Importar '+comps.length+' composições</button><button class="btn sec" onclick="fecharModal()">Cancelar</button></div>';
  $('icp-corpo').innerHTML=h;
}
function icpGravar(){
  const r=icpCalc(), comps=ICP.comps;
  if(r.revNovos.length){ const lote={}; r.revNovos.forEach(n=>{ const id=uid()+Math.random().toString(36).slice(2,5); lote[id]={id,nome:n,criado:Date.now()}; }); salvarLote('revenda', lote); }
  const pl={}; Object.keys(r.preco).forEach(p=>{ if(r.preco[p]>0) pl[p]=Math.round(r.preco[p]*100)/100; }); salvarLote('precos', pl);
  const cl={};
  comps.forEach(c=>{ const ex=r.porNome[c.nome.toLowerCase()]; const id=ex?ex.id:uid()+Math.random().toString(36).slice(2,5);
    cl[id]=Object.assign({}, ex||{}, {id, nome:c.nome, grupo:c.grupo, itens:c.itens.map(i=>({produto:i.produto, qtd:i.qtd}))}); });
  salvarLote('composicoes', cl);
  if(ICP.remover) r.sobram.forEach(c=>excluir('composicoes', c.id));
  fecharModal(); sub.orc='comp'; irPara('orc');
  setTimeout(()=>alert(comps.length+' composições importadas ('+r.novas+' novas). '+Object.keys(pl).length+' preços de peça gravados.'+(r.revNovos.length?' '+r.revNovos.length+' produto(s) de revenda cadastrado(s).':'')),80);
}

function vEstProd(p){

let _logoTmp=null;
function carregaLogo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=420, k=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
    _logoTmp=cv.toDataURL('image/jpeg',0.85);
    $('cf-logo-prev').innerHTML='<img class="logoprev" src="'+_logoTmp+'"><div class="mut">salve para confirmar</div>';
  }; img.src=r.result; };
  r.readAsDataURL(f);
}
function salvarCfg(){
  const c=Object.assign({}, S.config||{});
  c.nome=$('cf-nome').value.trim(); c.cnpj=$('cf-cnpj').value.trim(); c.ie=$('cf-ie').value.trim(); c.end=$('cf-end').value.trim();
  c.cid=$('cf-cid').value.trim(); c.fone=$('cf-fone').value.trim(); c.mail=$('cf-mail').value.trim();
  c.responsaveis=$('cf-resp').value.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const [n,f]=l.split(/\s*[;|]\s*/); return {nome:(n||'').trim(), fone:(f||'').trim()}; }).filter(r=>r.nome);
  c.validade=parseInt($('cf-val').value)||15; c.prazo=$('cf-prazo').value.trim(); c.pagamento=$('cf-pag').value.trim(); c.freteTxt=$('cf-frete').value.trim(); c.obs=$('cf-obs').value;
  if(_logoTmp!==null){ if(_logoTmp) c.logo=_logoTmp; else delete c.logo; _logoTmp=null; }
  salvar('config', null, c);
  alert('Configurações salvas.');
}

function salvarFin(){
  const l=FE, val=parseNum($('fe-val').value);
  if(!(val>0)){ alert('Informe o valor.'); return; }
  const venc=$('fe-venc').value; if(!venc){ alert('Informe o vencimento.'); return; }
  const base={tipo:l.tipo, origem:l.origem, descricao:$('fe-desc').value.trim(), pessoa:$('fe-pess').value.trim(), valor:val, forma:$('fe-forma').value,
    cheque:$('fe-forma').value==='Cheque'?$('fe-cheque').value.trim():'', banco:$('fe-forma').value==='Cheque'?$('fe-banco').value.trim():'',
    nota:l.origem==='nota'?$('fe-nota').value.trim():'', obs:$('fe-obs').value.trim(), pago:$('fe-pago').checked, dataPago:$('fe-pago').checked?($('fe-dpag').value||hoje()):''};
  if(l.id){ salvar('fin', l.id, Object.assign({}, S.fin[l.id], base, {id:l.id, venc})); }
  else{
    const n=Math.max(1, parseInt(($('fe-parc')||{}).value)||1);
    for(let i=0;i<n;i++){
      const id=uid()+i;
      const d=Object.assign({}, base, {id, venc:addMeses(venc,i), criado:Date.now()});
      if(n>1){ d.descricao=(base.descricao||'')+' ('+(i+1)+'/'+n+')'; if(i>0){ d.pago=false; d.dataPago=''; } }

  }

let KE=null;
// Campos iguais ao bloco DESTINATÁRIO da NF-e (+ código, celular, e-mail, obra e observação)
const CLI_CAMPOS=[['nome','Nome / razão social'],['codigo','Código no sistema'],['doc','CNPJ / CPF'],['ie','Inscrição estadual'],
  ['logr','Endereço (rua / avenida)'],['num','Número'],['compl','Complemento'],['bairro','Bairro / distrito'],['cep','CEP'],
  ['municipio','Município'],['uf','UF'],['fone','Fone / fax'],['cel','Celular / WhatsApp'],['email','E-mail'],
  ['obra','Local da obra / entrega'],['obs','Contatos / observação']];
// disposição na tela: linhas com 1 ou 2 campos
const CLI_LAYOUT=[['nome'],['codigo','doc'],['ie','fone'],['cel','email'],['logr'],['num','compl'],['bairro','cep'],['municipio','uf'],['obra'],['obs']];
const CLI_ROT=Object.fromEntries(CLI_CAMPOS);
function cliFormHTML(pref, obj, onin){
  return CLI_LAYOUT.map(lin=>{
    const cel=k=>'<div><label class="f">'+CLI_ROT[k]+'</label><input id="'+pref+k+'" value="'+esc(obj[k]||'')+'"'+(k==='uf'?' maxlength="2" style="text-transform:uppercase"':'')+(onin?' oninput="'+onin.replace('#K',k)+'"':'')+'></div>';
    return lin.length>1?'<div class="g2">'+lin.map(cel).join('')+'</div>':cel(lin[0]);
  }).join('');
}
// endereço e cidade montados (usados no PDF, entregas e busca)
function cliEnd(c){ if(!c) return ''; if(!c.logr&&!c.bairro&&!c.cep) return c.end||'';
  let e=c.logr||''; if(c.num) e+=(e?', ':'')+c.num; if(c.compl) e+=' - '+c.compl; if(c.bairro) e+=(e?' - ':'')+c.bairro; if(c.cep) e+=(e?' · ':'')+'CEP '+c.cep; return e; }
function cliCidade(c){ if(!c) return ''; if(!c.municipio&&!c.uf) return c.cidade||''; return [c.municipio, (c.uf||'').toUpperCase()].filter(Boolean).join(' / '); }
function cliCompor(c){ c.uf=(c.uf||'').toUpperCase(); const e=cliEnd(c), ci=cliCidade(c); if(e) c.end=e; if(ci) c.cidade=ci; return c; }
// endereço antigo (campo único) → campos separados
function cliSeparar(c){
  const x=Object.assign({},c);
  if(!x.municipio && x.cidade){ const m=String(x.cidade).split(/\s*\/\s*/); x.municipio=m[0]||''; if(m[1]&&m[1].length===2) x.uf=m[1].toUpperCase(); }
  if(!x.logr && x.end){
    let e=String(x.end); const mc=e.match(/\s*·\s*CEP\s*(.+)$/i); if(mc){ x.cep=x.cep||mc[1].trim(); e=e.slice(0,mc.index); }
    const partes=e.split(' - '); const cab=partes.shift()||'';
    if(partes.length){ x.bairro=x.bairro||partes.pop(); if(partes.length) x.compl=x.compl||partes.join(' - '); }
    const mn=cab.match(/^(.*),\s*([^,]+)$/); if(mn){ x.logr=mn[1].trim(); x.num=x.num||mn[2].trim(); } else x.logr=cab.trim();
  }
  return x;
}
function abrirCli(id){
  KE=id?cliSeparar(S.clientes[id]):{id:null};
  abrirModal('<h2>'+(id?'Editar cliente':'Novo cliente')+hq('cli_campos')+'<button class="ico x" onclick="fecharModal()">✕</button></h2>'+
    cliFormHTML('ke-', KE)+

}
function salvarCli(){
  const c={}; CLI_CAMPOS.forEach(([k])=>c[k]=$('ke-'+k).value.trim());
  if(!c.nome){ alert('Informe o nome.'); return; }
  c.id=KE.id||uid(); salvar('clientes', c.id, cliCompor(Object.assign({}, KE.id?S.clientes[KE.id]:{}, c))); fecharModal();
}
function upsertCliente(cli){
  if(!cli||!cli.nome) return;
  const L=Object.values(S.clientes).filter(Boolean);
  const ex=(cli.doc&&L.find(c=>c.doc&&c.doc===cli.doc)) || L.find(c=>(c.nome||'').toLowerCase()===cli.nome.toLowerCase());
  const id=ex?ex.id:uid();
  const novo=cliCompor(Object.assign({}, ex||{}, cli, {id}));
  if(!ex || CLI_CAMPOS.concat([['end'],['cidade']]).some(([k])=>(ex[k]||'')!==(novo[k]||''))) salvar('clientes', id, novo);
}

function oeTot(){

function oeAddProd(n){
  if(!n) return;
  OE.itens.push({tipo:'prod', nome:n, qtd:1, unit:precoProd(n)});
  if(!precoProd(n)) setTimeout(()=>alert('Este produto está sem preço na tabela — digite o unitário.'),50);
  oeRender();
}
function oeAddComp(){
  const c=S.composicoes[$('oe-addc').value]; if(!c) return;
  const sp=compSemPreco(c);
  OE.itens.push({tipo:'comp', nome:c.nome, descricao:c.descricao||'', compId:c.id, qtd:1, unit:Math.round(precoComp(c)*100)/100, comp:arr(c.itens).map(i=>({produto:i.produto, qtd:i.qtd}))});
  oeRender();

function oeMontar(){
  const o=OE, t=oeTotais();
  const cli={}; CLI_CAMPOS.forEach(([k])=>cli[k]=String((o.cliente||{})[k]||'').trim()); cliCompor(cli);
  const itens=o.itens.map(i=>{ const x={tipo:i.tipo, nome:i.nome, qtd:parseNum(i.qtd), unit:parseNum(i.unit)}; if(i.tipo==='comp'){ x.comp=arr(i.comp); x.descricao=i.descricao||''; x.compId=i.compId||''; } return x; }).filter(i=>i.qtd>0);
  return Object.assign({}, o, {cliente:cli, itens, validade:parseInt(o.validade)||15, descontoPct:parseNum(o.descontoPct), frete:parseNum(o.frete), subtotal:t.sub, desconto:t.desc, total:t.total});
}
function salvarOrc(pdf, silencioso){
  const o=oeMontar();
  if(!o.itens.length){ alert('Inclua ao menos um item.'); return; }
  if(!silencioso && !o.cliente.nome && !confirm('Salvar sem nome de cliente?')) return;
  if(!silencioso && !(o.responsavel&&o.responsavel.nome) && !confirm('Salvar sem o responsável pelo orçamento?')) return;
  try{ if(o.responsavel&&o.responsavel.nome) localStorage.setItem('gestao_ultimo_resp', o.responsavel.nome); }catch(e){}
  if(!o.id){ o.id=uid(); o.numero=proxNumero(); o.criado=Date.now(); }
  o.alterado=Date.now();
  let w=null; if(pdf) w=window.open('','_blank');
  const tinha=!!o.baixaEstoque;
  sincBaixa(o);
  salvar('orcamentos', o.id, o);
  if(silencioso && o.status==='aprovado') setTimeout(()=>alert(o.venda==='semnota'
    ? 'Aprovado — venda SEM nota: saída das peças lançada no estoque.'
    : 'Aprovado — venda COM nota: o estoque não foi mexido; a saída vem pelo arquivo do programa de notas.'+(tinha?'\n(A saída que existia foi removida.)':'')),60);
  upsertCliente(o.cliente);
  fecharModal();
  if(pdf) pdfOrcamento(o, w);
}
function statusOrc(st){
  if(st==='aprovado' && !OE.venda){ alert('Antes de aprovar, marque se a venda é COM nota ou SEM nota.'); return; }
  OE.status=st;
  salvarOrc(false, true);
}
// peças que saem do estoque (composição vira as peças)
function itensEstoque(o){
  const tot={};
  arr(o.itens).forEach(i=>{ if(i.tipo==='comp') arr(i.comp).forEach(c=>tot[c.produto]=(tot[c.produto]||0)+(Number(c.qtd)||0)*(Number(i.qtd)||0)); else tot[i.nome]=(tot[i.nome]||0)+(Number(i.qtd)||0); });
  return Object.keys(tot).map(p=>({produto:p, qtd:tot[p]}));
}
// Aprovado + SEM nota → tem saída no estoque (criada/atualizada aqui).
// Com nota, aberto ou perdido → não tem (a saída com nota vem do arquivo). Remove se existia.
function sincBaixa(o){
  const precisa = o.status==='aprovado' && o.venda==='semnota';
  const mid=o.baixaEstoque, mov=mid&&S.movs[mid];
  if(precisa){
    const id=mov?mid:uid();
    salvar('movs', id, Object.assign({data:hoje(), criado:Date.now()}, mov||{}, {id, tipo:'saida', origem:'manual', cliente:(o.cliente&&o.cliente.nome)||'', obs:'Orçamento nº '+numOrc(o.numero), itens:itensEstoque(o), orc:o.id}));
    o.baixaEstoque=id;
  }else{
    if(mov) excluir('movs', mid);
    o.baixaEstoque='';
  }
  return o;
}

  let h=cabecalho('FLUXO DA SEMANA', '', [['Semana',fmtDc(w.ini)+' a '+fmtD(w.fim)],['Emitido em',fmtD(hoje())]]);
  h+='<div class="sum"><div><span>A receber na semana</span><b class="pos">'+fmtR(w.rec)+'</b></div><div class="sm"><span>com nota '+fmtR(sub(w.prev,'receber','nota'))+' · sem nota '+fmtR(sub(w.prev,'receber','sem'))+'</span></div>'+
    '<div><span>A pagar na semana</span><b class="neg">'+fmtR(w.pag)+'</b></div><div class="sm"><span>com nota '+fmtR(sub(w.prev,'pagar','nota'))+' · sem nota '+fmtR(sub(w.prev,'pagar','sem'))+'</span></div>'+
    '<div class="g"><span>Saldo previsto</span><span>'+fmtR(w.rec-w.pag)+'</span></div></div>';
  h+='<div class="sec">A receber</div>'+tab(w.prev.filter(l=>l.tipo==='receber'));
  h+='<div class="sec">A pagar</div>'+tab(w.prev.filter(l=>l.tipo==='pagar'));
  if(w.venc.length) h+='<div class="sec">Vencidos antes da semana, em aberto (receber '+fmtR(w.recV)+' · pagar '+fmtR(w.pagV)+')</div>'+tab(w.venc);
  h+='<div class="sec">Realizado na semana</div><div class="cond"><div><b>Recebido:</b> '+fmtR(w.recR)+'</div><div><b>Pago:</b> '+fmtR(w.pagR)+'</div><div><b>Saldo realizado:</b> '+fmtR(w.recR-w.pagR)+'</div></div>';
  abrirImpressao('Fluxo semana '+fmtD(w.ini), h+rodape());
}
function pdfSemanaEst(){
  const ini=UI.estSem, fim=addDias(ini,6), sal=saldos();
  const prod={}, sai={}, ent={};
  producoes().filter(x=>x.data>=ini&&x.data<=fim).forEach(x=>prod[x.produto]=(prod[x.produto]||0)+x.qtd);
  Object.values(S.movs).filter(m=>m&&m.data>=ini&&m.data<=fim).forEach(m=>arr(m.itens).forEach(i=>{ const o=m.tipo==='saida'?sai:ent; o[i.produto]=(o[i.produto]||0)+(Number(i.qtd)||0); }));
  const ps=Array.from(new Set(Object.keys(prod).concat(Object.keys(sai),Object.keys(ent)))).sort();
  let h=cabecalho('ESTOQUE — SEMANA', '', [['Semana',fmtDc(ini)+' a '+fmtD(fim)],['Emitido em',fmtD(hoje())]]);
  h+='<div class="sec">Movimento da semana</div>'+(ps.length?'<table class="rl"><thead><tr><th>Produto</th><th class="r">Produzido</th><th class="r">Saídas</th><th class="r">Entradas/ajustes</th><th class="r">Saldo atual</th></tr></thead><tbody>'+
    ps.map(p=>'<tr><td>'+esc(p)+'</td><td class="r">'+(prod[p]?fmtN(prod[p]):'')+'</td><td class="r">'+(sai[p]?fmtN(sai[p]):'')+'</td><td class="r">'+(ent[p]?fmtN(ent[p]):'')+'</td><td class="r">'+fmtN(sal[p]||0)+'</td></tr>').join('')+'</tbody></table>':'<div class="sm">Sem movimento.</div>');
  const comS=Object.keys(sal).filter(p=>sal[p]).sort();
  h+='<div class="sec">Saldo de todos os produtos</div><table class="rl"><thead><tr><th>Produto</th><th class="r">Saldo</th></tr></thead><tbody>'+comS.map(p=>'<tr><td>'+esc(p)+'</td><td class="r '+(sal[p]<0?'neg':'')+'">'+fmtN(sal[p])+'</td></tr>').join('')+'</tbody></table>';
  abrirImpressao('Estoque semana '+fmtD(ini), h+rodape());
}
